name: 功能建议
description: 希望插件新增功能，或改进现有体验时使用此模板
title: "[Feature] "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        ### 提交前请确认
        - 请先在 [Issues](../../issues?q=is%3Aissue) 中搜索，避免重复建议
        - 请务必说明**使用场景**，这决定了该功能是否值得实现
        - 本插件不参与资金流转（不接支付网关、不代收），与收款自动化相关的能力受此限制

  - type: textarea
    id: description
    attributes:
      label: 功能描述
      description: 用简洁的语言描述你希望新增或改进的内容
      placeholder: 例如：希望赞助者墙支持按金额或时间排序……
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 该功能解决什么场景下的什么需求？目前的做法为什么不合适？
      placeholder: 例如：我的打赏记录较多，默认按时间倒序看不出主要支持者……
    validations:
      required: true

  - type: textarea
    id: expectation
    attributes:
      label: 期望的交互（可选）
      description: 在哪个页面出现、如何操作、有哪些可配置项

  - type: textarea
    id: reference
    attributes:
      label: 参考实现（可选）
      description: 其他插件或站点中的类似能力，附链接或截图有助于理解
